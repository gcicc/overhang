name: OVERHANG Refresh

# Every 6 hours (UTC). Each source declares its own max_age in overhang/cache.py,
# so most runs fetch only Manifold; METR/Epoch/ARC refresh daily, the quote check weekly.
#
# This workflow only generates content and commits it to the branch. Pages is served
# from /docs on main, never built by a workflow -- see
# 03-Tools/project-management/docs/PUBLISHING-PROTOCOL.md.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # poppler-utils provides pdftotext for checking quotes whose source is a PDF.
      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install requests jinja2

      - name: Refresh and render
        run: python run.py

      - name: Commit and push
        run: |
          git config user.name "OVERHANG Bot"
          git config user.email "action@github.com"
          git add docs/index.html data/
          git diff --cached --quiet || git commit -m "chore: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
